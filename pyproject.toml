[project]
name = "torboxed"
version = "1.1.0"
description = "Sync Trakt.tv curated movies/shows to your debrid service (Torbox/Real Debrid) with intelligent quality-based auto-upgrades"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
    "guessit>=3.7.0",
]

[project.optional-dependencies]
zilean = [
    "psycopg[binary]>=3.1.0",
]
webdav = [
    "wsgidav>=4.0.0",
    "cheroot>=10.0.0",
]

[project.scripts]
torboxed = "torboxed:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
