# Continuous Integration for TorBoxed (issue #9)
#
# - test job: full pytest suite on Python 3.10-3.12, on every push/PR
# - dependency-audit job: weekly pip-audit scan of the locked dependency set
#
# Intentionally minimal: no deploy steps, no publishing.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency audit (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Run test suite
        run: uv run --no-sync pytest tests/ -v

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # Weekly schedule + manual runs; also useful on lockfile changes via PRs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Export locked dependencies
        # --no-emit-project: exclude the editable '-e .' entry for this project.
        # pip-audit installs requirements internally with hash checking enabled,
        # and pip rejects editable installs combined with hashes.
        run: uv export --frozen --no-emit-project --format requirements-txt --output-file requirements-audit.txt

      - name: Upload lockfile export for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locked-requirements
          path: requirements-audit.txt

      - name: Run pip-audit against locked dependencies
        run: |
          python -m pip install --upgrade pip 'pip-audit==2.7.3'
          python -m pip_audit -r requirements-audit.txt --strict
