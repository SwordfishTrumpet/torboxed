# Continuous Integration for TorBoxed (issue #9)
#
# - test job: full pytest suite on Python 3.9-3.12, on every push/PR
# - dependency-audit job: weekly pip-audit scan of the locked dependency set
#
# Intentionally minimal: no deploy steps, no publishing.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency audit (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Run test suite
        run: uv run --no-sync pytest tests/ -v

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # Weekly schedule + manual runs; also useful on lockfile changes via PRs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Export locked dependencies
        run: uv export --frozen --format requirements-txt --output-file requirements-audit.txt

      - name: Upload lockfile export for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locked-requirements
          path: requirements-audit.txt

      - name: Run pip-audit against locked dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r requirements-audit.txt --strict
