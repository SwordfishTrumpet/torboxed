services:
  # ===========================================================================
  # TorBoxed - Main sync service
  # ===========================================================================
  # Quick Start:
  # 1. Create .env file with your API keys
  # 2. Run: docker-compose up --build
  # 3. For automated sync, uncomment the schedule below
  #
  torboxed:
    build: .
    container_name: torboxed
    volumes:
      - ./data:/data
      # Mount your .env file (create it first!)
      - ./.env:/data/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      # Zilean database connection (via zilean-network, postgres container)
      - ZILEAN_DATABASE_URL=postgresql://zilean:zilean_password@postgres:5432/zilean
    # For one-shot runs (manual sync):
    # Run with --verbose for logs; exits after sync completes
    command: ["--verbose"]
    
    networks:
      - torboxed-network
      - zilean-network

networks:
  torboxed-network:
    driver: bridge
  zilean-network:
    external: true
